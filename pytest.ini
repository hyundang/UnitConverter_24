[pytest]
testpaths = tests
pythonpath = . src
addopts = -ra --continue-on-collection-errors
markers =
    prd_s1: PRD S1 — validation messages (format / number / unknown unit)
    prd_s2: PRD S2 — conversion correctness (meter, feet, yard)
    prd_s3: PRD S3 — registry single source (unit add / diff scope)
    prd_s4: PRD S4 — output formats (JSON / CSV / table, FR-4)
